openapi: 3.1.0
info:
  title: Ticketmaster Booking API
  version: 0.0.1
paths:
  /events/{eventId}/sections:
    get:
      tags: [Booking]
      operationId: getSections
      summary: List seat-map sections currently projected for an event
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Eventually consistent section directory
          headers:
            Cache-Control:
              schema: { type: string, example: 'public, max-age=60, stale-while-revalidate=300' }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SectionResponse' }
        '503': { description: Seat-map storage is temporarily unavailable; retry may succeed }
  /events/{eventId}/sections/{sectionId}/seats:
    get:
      tags: [Booking]
      operationId: getSectionSeats
      summary: View the eventually consistent live seat map for a section
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: string }
        - in: path
          name: sectionId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Section seat map; CHECKOUT seats remain unavailable until the purchase is booked or safely released
          headers:
            Cache-Control:
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SeatMapSeatResponse' }
        '503': { description: Seat-map storage is temporarily unavailable; retry may succeed }
  /events/{eventId}/checkout:
    post:
      tags: [Booking]
      operationId: startCheckout
      summary: Atomically reserve selected seats and start a fixed-window checkout
      description: Seat selection remains client-side until this call. The authoritative transaction moves selected seats directly from AVAILABLE to CHECKOUT, creates the checkout reservation and pending Booking, and fixes checkoutExpiresAt. Recoverable card declines do not release seats or extend that deadline.
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: string }
        - in: header
          name: Idempotency-Key
          required: true
          description: Repeating the same key with the same user, event, and seats returns the original checkout
          schema: { type: string, minLength: 1, maxLength: 200 }
        - in: header
          name: X-User-Id
          required: true
          description: Authenticated user identity supplied by the trusted request/authentication boundary
          schema: { type: string, minLength: 1 }
        - in: header
          name: X-Admission-Token
          required: false
          description: Short-lived signed proof returned after waiting-room admission; invalid or absent tokens fall back to authoritative admission reads
          schema: { type: string, minLength: 1, maxLength: 2000 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartCheckoutRequest' }
      responses:
        '200':
          description: Checkout started or the existing idempotent checkout returned with its original fixed deadline
          headers:
            Cache-Control:
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckoutResponse' }
        '403': { description: Waiting-room admission is enabled for the event and the user is not yet admitted }
        '409': { description: "Seats are unavailable, an authoritative price changed, or the idempotency key was reused for a different seat selection" }
        '421': { description: Request reached the wrong booking region; X-Booking-Region identifies the current owner }
        '503': { description: "Booking ownership, authoritative storage, or payment provider is temporarily unavailable; retry may succeed" }
  /events/{eventId}/waiting-room:
    post:
      tags: [WaitingRoom]
      operationId: joinWaitingRoom
      summary: Join an enabled hot-event waiting room
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: string }
        - in: header
          name: X-User-Id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Existing or newly-created waiting-room entry
          headers:
            Cache-Control:
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WaitingRoomEntryResponse' }
        '409': { description: Waiting room is not enabled for this event }
        '503': { description: Waiting-room storage is temporarily unavailable; retry may succeed }
    get:
      tags: [WaitingRoom]
      operationId: getAdmissionStatus
      summary: Check whether the user has been admitted
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: string }
        - in: header
          name: X-User-Id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Current admission status; admitted users may also receive a short-lived admission grant
          headers:
            Cache-Control:
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdmissionStatusResponse' }
        '404': { description: "Waiting room is enabled, but this user has not joined it" }
        '409': { description: Waiting room is not enabled for this event }
        '503': { description: Waiting-room storage is temporarily unavailable; retry may succeed }
components:
  schemas:
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: number }
        currency: { type: string }
    SectionResponse:
      type: object
      required: [sectionId]
      properties:
        sectionId: { type: string }
    SeatMapSeatResponse:
      type: object
      required: [seatId, sectionId, row, number, price, status]
      properties:
        seatId: { type: string }
        sectionId: { type: string }
        row: { type: string }
        number: { type: string }
        price: { $ref: '#/components/schemas/Money' }
        status:
          type: string
          enum: [AVAILABLE, CHECKOUT, BOOKED]
    StartCheckoutRequest:
      type: object
      required: [seatIds]
      properties:
        seatIds:
          type: array
          minItems: 1
          maxItems: 96
          uniqueItems: true
          items: { type: string }
    CheckoutResponse:
      type: object
      required: [bookingId, status, paymentIntentId, checkoutExpiresAt]
      properties:
        bookingId: { type: string }
        status: { type: string }
        paymentIntentId: { type: string }
        checkoutExpiresAt:
          type: string
          format: date-time
          description: Fixed absolute checkout deadline. Retrying a declined card does not move this value.
    WaitingRoomEntryResponse:
      type: object
      required: [eventId, userId, joinedAt]
      properties:
        eventId: { type: string }
        userId: { type: string }
        joinedAt: { type: string, format: date-time }
    AdmissionStatusResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [WAITING, ADMITTED]
        admissionToken:
          type: string
          description: Present only when admission-grant issuance is enabled and status is ADMITTED
        admissionTokenExpiresAt:
          type: string
          format: date-time
          description: Expiration of admissionToken when present
