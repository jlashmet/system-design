openapi: 3.1.0
info:
  title: Ticketmaster Booking API
  version: 0.0.1
paths:
  /events/{eventId}/sections:
    get:
      tags: [Booking]
      operationId: getSections
      summary: List seat-map sections currently projected for an event
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Eventually consistent section directory
          headers:
            Cache-Control:
              schema: { type: string, example: 'public, max-age=60, stale-while-revalidate=300' }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SectionResponse' }
  /events/{eventId}/sections/{sectionId}/seats:
    get:
      tags: [Booking]
      operationId: getSectionSeats
      summary: View the eventually consistent live seat map for a section
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: string }
        - in: path
          name: sectionId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Section seat map
          headers:
            Cache-Control:
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SeatMapSeatResponse' }
  /events/{eventId}/holds:
    post:
      tags: [Booking]
      operationId: createHold
      summary: Idempotently hold seats at their current authoritative prices
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: string }
        - in: header
          name: Idempotency-Key
          required: true
          description: Repeating the same key with the same user/event/seats returns the original Hold
          schema: { type: string, minLength: 1, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateHoldRequest' }
      responses:
        '201':
          description: Hold created, or the original successful Hold returned for an idempotent retry
          headers:
            Cache-Control:
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HoldResponse' }
        '403': { description: Waiting-room admission is enabled for the event and the user is not yet admitted }
        '409': { description: Seats are unavailable, a quoted price changed, or the idempotency key was reused for a different request }
        '421': { description: Request reached the wrong booking region; X-Booking-Region identifies the current owner }
        '503': { description: Booking ownership cannot currently be established }
  /events/{eventId}/holds/{holdId}/checkout:
    post:
      tags: [Booking]
      operationId: startCheckout
      summary: Start checkout for an active hold in the event's authoritative booking region
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: string }
        - in: path
          name: holdId
          required: true
          schema: { type: string }
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Checkout started
          headers:
            Cache-Control:
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckoutResponse' }
        '409': { description: Hold is expired or not active }
        '421': { description: Request reached the wrong booking region; X-Booking-Region identifies the current owner }
        '503': { description: Booking ownership cannot currently be established }
  /events/{eventId}/waiting-room:
    post:
      tags: [WaitingRoom]
      operationId: joinWaitingRoom
      summary: Join a hot event waiting room
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: string }
        - in: header
          name: X-User-Id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Existing or newly-created waiting-room entry
          headers:
            Cache-Control:
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WaitingRoomEntryResponse' }
    get:
      tags: [WaitingRoom]
      operationId: getAdmissionStatus
      summary: Check whether the user has been admitted
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: string }
        - in: header
          name: X-User-Id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Current admission status
          headers:
            Cache-Control:
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdmissionStatusResponse' }
components:
  schemas:
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: number }
        currency: { type: string }
    SectionResponse:
      type: object
      required: [sectionId]
      properties:
        sectionId: { type: string }
    SeatMapSeatResponse:
      type: object
      required: [seatId, sectionId, row, number, price, status]
      properties:
        seatId: { type: string }
        sectionId: { type: string }
        row: { type: string }
        number: { type: string }
        price: { $ref: '#/components/schemas/Money' }
        status: { type: string }
    CreateHoldRequest:
      type: object
      required: [userId, seatIds]
      properties:
        userId: { type: string }
        seatIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string }
    HoldResponse:
      type: object
      required: [holdId, eventId, userId, seatIds, totalPrice, status, expiresAt]
      properties:
        holdId: { type: string }
        eventId: { type: string }
        userId: { type: string }
        seatIds:
          type: array
          items: { type: string }
        totalPrice: { $ref: '#/components/schemas/Money' }
        status: { type: string }
        expiresAt: { type: string, format: date-time }
    CheckoutResponse:
      type: object
      required: [bookingId, status, paymentIntentId]
      properties:
        bookingId: { type: string }
        status: { type: string }
        paymentIntentId: { type: string }
    WaitingRoomEntryResponse:
      type: object
      required: [eventId, userId, joinedAt]
      properties:
        eventId: { type: string }
        userId: { type: string }
        joinedAt: { type: string, format: date-time }
    AdmissionStatusResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [WAITING, ADMITTED]
