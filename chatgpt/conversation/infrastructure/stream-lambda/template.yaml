AWSTemplateFormatVersion: '2010-09-09'
Description: ChatGPT inference handoff from DynamoDB Streams through Lambda to SQS.

Parameters:
  ConversationStreamArn:
    Type: String
    Description: Stream ARN for the conversation DynamoDB table. Enable Streams with NEW_IMAGE.
  InferenceQueueUrl:
    Type: String
    Description: URL of the existing inference SQS queue.
  InferenceQueueArn:
    Type: String
    Description: ARN of the existing inference SQS queue.
  StreamFailureQueueArn:
    Type: String
    Description: ARN of the SQS queue that receives exhausted DynamoDB Streams invocation records for diagnosis/replay.
  LambdaCodeBucket:
    Type: String
    Description: S3 bucket containing the shaded stream-lambda artifact.
  LambdaCodeKey:
    Type: String
    Description: S3 key for conversation-infrastructure-stream-lambda-*-lambda.jar.
  StartingPosition:
    Type: String
    Default: TRIM_HORIZON
    AllowedValues: [TRIM_HORIZON, LATEST]
    Description: DynamoDB Streams starting position. TRIM_HORIZON is safer for a newly attached consumer within stream retention.
  MaximumRetryAttempts:
    Type: Number
    Default: 10
    MinValue: 0
    MaxValue: 10000
    Description: Maximum retries for a failed stream batch/record before sending failure metadata to StreamFailureQueueArn.
  MaximumRecordAgeInSeconds:
    Type: Number
    Default: 21600
    MinValue: 60
    MaxValue: 604800
    Description: Maximum age of a stream record before it is sent to the failure destination. Default is six hours.

Resources:
  InferenceStreamLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ReadConversationStreamAndSendInference
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:DescribeStream
                  - dynamodb:GetRecords
                  - dynamodb:GetShardIterator
                Resource: !Ref ConversationStreamArn
              - Effect: Allow
                Action:
                  - dynamodb:ListStreams
                Resource: '*'
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource:
                  - !Ref InferenceQueueArn
                  - !Ref StreamFailureQueueArn

  InferenceStreamLambda:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: java21
      Handler: com.systemdesign.chatgpt.conversation.infrastructure.streamlambda.DynamoGenerationStreamHandler::handleRequest
      Role: !GetAtt InferenceStreamLambdaRole.Arn
      MemorySize: 512
      Timeout: 30
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref LambdaCodeKey
      Environment:
        Variables:
          INFERENCE_QUEUE_URL: !Ref InferenceQueueUrl

  InferenceStreamMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !Ref ConversationStreamArn
      FunctionName: !Ref InferenceStreamLambda
      StartingPosition: !Ref StartingPosition
      BatchSize: 100
      MaximumBatchingWindowInSeconds: 1
      BisectBatchOnFunctionError: true
      FunctionResponseTypes:
        - ReportBatchItemFailures
      MaximumRecordAgeInSeconds: !Ref MaximumRecordAgeInSeconds
      MaximumRetryAttempts: !Ref MaximumRetryAttempts
      DestinationConfig:
        OnFailure:
          Destination: !Ref StreamFailureQueueArn
      FilterCriteria:
        Filters:
          - Pattern: '{"eventName":["INSERT"],"dynamodb":{"NewImage":{"entityType":{"S":["GENERATION"]},"status":{"S":["PENDING"]}}}}'

Outputs:
  InferenceStreamLambdaArn:
    Value: !GetAtt InferenceStreamLambda.Arn
