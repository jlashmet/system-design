name: ChatGPT Verify

on:
  push:
    paths:
      - 'chatgpt/**'
      - '.github/workflows/chatgpt-verify.yml'
  pull_request:
    paths:
      - 'chatgpt/**'
      - '.github/workflows/chatgpt-verify.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify ChatGPT modules
        run: mvn -B -f chatgpt/pom.xml verify
