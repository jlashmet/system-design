openapi: 3.1.0
info:
  title: Ticketmaster Events API
  version: 0.0.1
paths:
  /events/{eventId}:
    get:
      tags: [Events]
      operationId: getEvent
      summary: Get event details
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Event details
          headers:
            Cache-Control:
              description: CDN/browser caching policy for stable event metadata
              schema:
                type: string
                example: public, max-age=60, stale-while-revalidate=300
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventResponse' }
        '404': { description: Event not found }
components:
  schemas:
    EventResponse:
      type: object
      required: [eventId, name, venueId, startsAt, category, status]
      properties:
        eventId: { type: string }
        name: { type: string }
        venueId: { type: string }
        startsAt: { type: string, format: date-time }
        category: { type: string }
        status: { type: string }
        description: { type: string }
