name: ChatGPT Verify

on:
  push:
    paths:
      - 'chatgpt/**'
      - '.github/workflows/chatgpt-verify.yml'
  pull_request:
    paths:
      - 'chatgpt/**'
      - '.github/workflows/chatgpt-verify.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify ChatGPT
        run: mvn -f chatgpt/pom.xml --batch-mode verify
