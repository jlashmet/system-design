openapi: 3.1.0
info:
  title: Ticketmaster Events API
  version: 0.0.1
paths:
  /admin/events:
    post:
      tags: [Events]
      operationId: createEvent
      summary: Create an event
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateEventRequest' }
      responses:
        '201':
          description: Event created
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventResponse' }
        '409': { description: Event ID already exists }
        '503': { description: Event metadata storage is temporarily unavailable; retry may succeed }
  /events/{eventId}:
    get:
      tags: [Events]
      operationId: getEvent
      summary: Get event details
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Event details
          headers:
            Cache-Control:
              description: CDN/browser caching policy for stable event metadata, including brief stale service during origin failure
              schema:
                type: string
                example: public, max-age=60, stale-while-revalidate=300, stale-if-error=300
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventResponse' }
        '404': { description: Event not found }
        '503': { description: Event metadata storage is temporarily unavailable; retry may succeed }
components:
  schemas:
    CreateEventRequest:
      type: object
      required: [eventId, name, venueId, startsAt, category]
      properties:
        eventId: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        venueId: { type: string, minLength: 1 }
        startsAt: { type: string, format: date-time }
        category: { type: string, minLength: 1 }
        description: { type: string }
    EventResponse:
      type: object
      required: [eventId, name, venueId, startsAt, category, status]
      properties:
        eventId: { type: string }
        name: { type: string }
        venueId: { type: string }
        startsAt: { type: string, format: date-time }
        category: { type: string }
        status: { type: string }
        description: { type: string }
