openapi: 3.1.0
info:
  title: Ticketmaster Booking API
  version: 0.0.1
paths:
  /events/{eventId}/sections/{sectionId}/seats:
    get:
      summary: View the eventually consistent seat map for a section
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: string }
        - in: path
          name: sectionId
          required: true
          schema: { type: string }
      responses:
        '200': { description: Section seat map }
  /events/{eventId}/holds:
    post:
      summary: Temporarily hold a set of seats
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: string }
      responses:
        '201': { description: Hold created }
        '409': { description: One or more seats are unavailable }
  /holds/{holdId}/checkout:
    post:
      summary: Start checkout for an active hold
      parameters:
        - in: path
          name: holdId
          required: true
          schema: { type: string }
      responses:
        '200': { description: Checkout started }
        '409': { description: Hold is expired or not active }
